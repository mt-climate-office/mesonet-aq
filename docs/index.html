<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montana Mesonet — Air Quality Explorer</title>
  <!-- MapLibre GL 6.11.2 (GHSA-jrc7-96c5-q579: <= 6.4.0 has an attribution-string XSS).
       6.x is ES-modules only: app.js imports it. import() takes no integrity
       attribute, so the SRI hashes live in this import map, which the browser
       applies to the entry and its shared chunk. Copied byte for byte from
       mco-web-style snippets/head.html (v0.12.0) so its CSP sha256 matches the
       kit's. Keep it ONE line and ahead of every module script. -->
  <script type="importmap">{"integrity":{"https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs":"sha384-KQzExYlfg1SnYNpLaXHTnaCTjr5wmiZ6X3sasvPb94caZfH+3+T1Sl4eJziXUtmN","https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl-shared.mjs":"sha384-V59ofCEPEqpSk5Mswc19DtDYbZWJtne210dFzS328Il6O31eLwTV7v57+Z3NjW/7"}}</script>
  <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs"
        integrity="sha384-KQzExYlfg1SnYNpLaXHTnaCTjr5wmiZ6X3sasvPb94caZfH+3+T1Sl4eJziXUtmN"
        crossorigin="anonymous">
  <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl-shared.mjs"
        integrity="sha384-V59ofCEPEqpSk5Mswc19DtDYbZWJtne210dFzS328Il6O31eLwTV7v57+Z3NjW/7"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
        integrity="sha384-ntw3zEt6rcVML7jDK0ULmHa5hxLB23afsPqzqfY+gLgMfAkbFCnCgPpkZvV5mmZX"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.6/css/dataTables.dataTables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Montana Mesonet — Air Quality Explorer</h1>
    <div id="status" class="status">Initializing…</div>
  </header>
  <main>
    <aside id="sidebar">
      <h2>Station</h2>
      <select id="station-select"></select>

      <h2>Date range</h2>
      <label>Start <input type="date" id="start-date"></label>
      <label>End <input type="date" id="end-date"></label>

      <h2>Variable (chart)</h2>
      <select id="variable-select"></select>

      <button id="load-btn">Reload</button>

      <div id="info"></div>
    </aside>
    <section id="content">
      <div id="map"></div>
      <div id="bottom">
        <div id="chart-wrap"><canvas id="chart"></canvas></div>
        <div id="table-wrap">
          <table id="data-table" class="display compact" style="width:100%"></table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.datatables.net/2.1.6/js/dataTables.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
