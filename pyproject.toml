[project]
name = "mesonet-aq"
version = "1.0.0"
description = "Nightly PurpleAir archive for the Montana Mesonet, published to the MCO data CDN."
authors = [{ name = "Montana Climate Office" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "boto3>=1.35",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.scripts]
mesonet-aq = "mesonet_aq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesonet_aq"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
