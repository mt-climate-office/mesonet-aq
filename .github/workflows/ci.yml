name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes, and a retagged third-party action runs with
# whatever this grants.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build only (no push): proves the image the schedule will run still builds.
      - run: docker buildx build --platform linux/amd64 --provenance=false -t mesonet-aq:ci --load .
      - run: docker run --rm mesonet-aq:ci --help

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks-action requires a paid license for org repos; the CLI does not.
      - run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  # Inline rather than mco-aws's reusable terraform-check.yml: this repo is
  # PUBLIC and mco-aws is private, and GitHub refuses a public repo calling a
  # private repo's reusable workflow (the run dies in 0 s as a "workflow file
  # issue"). Same steps.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      # Module sources live in private mco-aws: init needs the org read token.
      # It is absent on fork PRs, so validate is skipped there rather than failing.
      - name: init + validate
        env:
          MCO_AWS_READ_TOKEN: ${{ secrets.MCO_AWS_READ_TOKEN }}
        run: |
          if [ -z "$MCO_AWS_READ_TOKEN" ]; then
            echo "::warning::MCO_AWS_READ_TOKEN not available; skipping terraform validate"
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${MCO_AWS_READ_TOKEN}@github.com/mt-climate-office/mco-aws".insteadOf \
            "https://github.com/mt-climate-office/mco-aws"
          terraform init -backend=false -input=false
          terraform validate
